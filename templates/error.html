<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lloeva Beauty</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; max-width: 640px; margin: 80px auto; padding: 0 20px; color: #3b1426; background: #fff5f8; }
    code { display: block; padding: 12px; background: #fff; border-radius: 8px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>The report could not load</h1>
  <p>The app could not read the Google Sheet. Check the credentials and that the sheet is shared with the service account.</p>
  {% if message %}<code>{{ message }}</code>{% endif %}
  <p><a href="/?refresh=1">Try again</a></p>
</body>
</html>
